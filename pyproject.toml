[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anyrecon"
version = "0.3.0"
description = "Reconcile any set of documents: identifier discovery, tiered deterministic matching, PCI-aware ingestion."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "numpy",
  "openpyxl>=3.1",      # reading Excel
  "xlsxwriter>=3.1",    # writing the report (streams rows to disk: fast, low memory)
  "pdfplumber>=0.11",
]

[project.optional-dependencies]
ui = ["streamlit>=1.40", "rapidfuzz>=3.0"]   # rapidfuzz: faster near-miss hints (falls back to difflib)
ocr = ["pytesseract>=0.3", "Pillow"]   # also needs the tesseract binary
ai = ["anthropic"]
dev = ["pytest", "reportlab", "markdown"]   # reportlab: examples/generate_samples.py; markdown: guide page

[project.scripts]
anyrecon = "anyrecon.cli:main"

[tool.setuptools]
packages = ["anyrecon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
